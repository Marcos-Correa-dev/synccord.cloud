[package]
name = "synccord-desktop"
version = "0.1.14"
edition = "2021"
description = "SyncCord Desktop Native Rust Client - High Performance, Low Memory"
authors = ["Marcos Correa"]

[[bin]]
name = "synccord-desktop"
path = "src/main.rs"

[[bin]]
name = "SyncCordSetup"
path = "src/installer.rs"

[dependencies]
tao = "0.37.2"
wry = "0.57.2"
tray-icon = "0.26.1"
single-instance = "0.3.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
